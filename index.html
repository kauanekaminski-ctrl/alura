
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center; 
      justify-content: flex-start; 
      padding-top: 40px; 
      background-color: #f0f0f0;
      box-sizing: border-box;
    }

    header {
      background-color: rgb(0, 0, 0);
      color: rgb(255, 250, 250);
      text-align: center;
      width: 100%;
      max-width: 800px;
      padding: 16px;
      border: 5px solid rgb(128,128,128);
      box-sizing: border-box;
    }

    /* flex-direction: column força os artigos a ficarem empilhados */
    main {
      display: flex;
      flex-direction: column; 
      gap: 20px;
      background-color: rgb(250, 250, 250);
      color: rgb(0, 0, 0);
      width: 100%;
      max-width: 800px;
      padding: 16px;
      box-sizing: border-box;
    }

    article {
      display: flex;
      gap: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 20px;
    }

    img {
      width: 200px;
      height: 200px;
      object-fit: cover;
    }

    .artigo-autor {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>  
    <h1>Minha página sobre a história de Jack Risonho</h1>
    <p>Vou te contar a história de Jack Risonho</p>
  </header>

  <main>
    <article>
      <img src="images (1).jpeg" alt="Jack Risonho">
      <div>
        <h2>Meu primeiro post</h2>
        <p class="artigo-autor">Por: Kauane Kaminski</p>
        <p>Bem-vindos! Aqui vou compartilhar a história de Jack Risonho.</p>
        <button>👍 <span>0</span></button>
        <button>👎 <span>0</span></button>
      </div>
    </article>

    <article>
      <img src="images (1).jpeg" alt="Jack Risonho">
      <div>
        <h2>Meu segundo post</h2>
        <p class="artigo-autor">Por: Kauane Kaminski</p>
        <p>Bem-vindos! Aqui vou compartilhar a história de Jack Risonho.</p>
        <button>👍 <span>0</span></button>
        <button>👎 <span>0</span></button>
      </div>
    </article>
  </main>

  <script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function(botao) {
      botao.addEventListener("click", function() {
        let contador = botao.querySelector("span");
        contador.textContent = Number(contador.textContent) + 1;
      });
    });
  </script>
</body>
</html>
