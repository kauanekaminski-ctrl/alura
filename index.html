
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <style>
    /* Regra adicionada para centralizar todo o conteúdo na tela */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0; /* Cor de fundo suave para destacar os blocos */
    }

    header {
      background-color: rgb(0, 0, 0);
      color: rgb(255, 250, 250);
      text-align: center;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      border: 5px solid rgb(255, 0, 0);
      box-sizing: border-box;
    }

    main {
      display: flex;
      gap: 20px;
      background-color: rgb(250, 250, 250);
      color: rgb(0, 0, 0);
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
    }

    img {
      margin-top: 20px;
      width: 200px;
      height: 200px;
      object-fit: cover;
    }

    .artigo-autor {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>  
    <h1>Minha página sobre a história de Jack Risonho</h1>
    <p>Vou te contar a história de Jack Risonho</p>
  </header>

  <main>
    <img src="images (1).jpeg" alt="Jack Risonho">
    <div>
      <h2>Meu primeiro post</h2>
      <p class="artigo-autor">Por: Kauane Kaminski</p>
      <p>Bem-vindos! Aqui vou compartilhar a história de Jack Risonho.</p>
      <button>👍 <span>0</span></button>
      <button>👎 <span>0</span></button>
    </div>
  </main>

  <script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function(botao) {
      botao.addEventListener("click", function() {
        let contador = botao.querySelector("span");
        contador.textContent = Number(contador.textContent) + 1;
      });
    });
  </script>
</body>
</html>
